name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-and-validate:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests
        shell: pwsh
        run: ./tools/run-tests.ps1

      - name: Check repository health
        shell: pwsh
        run: ./tools/check-repo-health.ps1
